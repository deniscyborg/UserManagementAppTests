name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  ALLURE_VERSION: "2.27.0"
  REPORT_URL: "https://report.usermanagementapp.com"
  RESULTS_DIR: tests/bin/Release/net10.0/allure-results

jobs:
  test:
    name: Tests (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: "http://localhost:5173"
      API_BASE_URL: "http://localhost:5006/api"
      BROWSER: "chromium"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        run: |
          dotnet build backend -c Release
          nohup dotnet run --project backend -c Release --no-build --urls "http://localhost:5006" > backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Wait for services
        run: |
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5006/health
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:5173

      - name: Build tests
        run: dotnet build tests -c Release

      - name: Install Playwright browser
        run: pwsh tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backend.log
            frontend.log

  report:
    name: Publish Allure report and showcase
    needs: test
    # The report is published even when tests fail — that is when it matters most
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Restore history from the published report
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            # http + --location works both before and after HTTPS is enabled;
            # the second URL is the old report that used to live at the site root
            curl --silent --fail --location "http://report.usermanagementapp.com/allure/history/$f" -o "allure-results/history/$f" \
              || curl --silent --fail --location "http://report.usermanagementapp.com/history/$f" -o "allure-results/history/$f" \
              || echo "No previous $f"
          done

      - name: Describe environment
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "$REPORT_URL/allure/"
          }
          EOF
          cat > allure-results/environment.properties <<EOF
          Browser=Chromium (Playwright)
          .NET=${{ env.DOTNET_VERSION }}
          Commit=${{ github.sha }}
          EOF

      - name: Generate report
        run: |
          curl --silent --fail --location -o allure.zip \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip"
          unzip -q allure.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin/allure" generate allure-results --clean -o allure-report

      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/report
            find /var/www/report -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            mkdir -p /var/www/report/allure

      - name: Upload showcase
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "showcase/*"
          target: "/var/www/report/"
          strip_components: 1

      - name: Upload Allure report
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "allure-report/*"
          target: "/var/www/report/allure/"
          strip_components: 1

  deploy:
    name: Deploy application
    needs: test
    # The app is deployed only when all tests are green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/UserManagementAppTests
            git fetch origin main
            git reset --hard origin/main
            docker-compose build
            docker-compose up -d --remove-orphans
            docker image prune -f

      - name: Smoke check
        run: |
          curl --silent --fail --location --retry 10 --retry-delay 3 --retry-all-errors http://usermanagementapp.com/api/users
